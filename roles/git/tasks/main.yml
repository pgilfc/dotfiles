---
- name: Ensure git is installed
  become: true
  ansible.builtin.dnf:
    name: git
    state: present

- name: Check git username
  community.general.git_config_info:
    name: user.name
    scope: global
  register: git_username_config

# non-interactive runs (cmd/vm/vm.sh test) inject -e git_user_name=... instead
- name: Prompt git username
  ansible.builtin.pause:
    prompt: Insert git user name
  register: git_username_prompt
  when: git_user_name is undefined and git_username_config.config_value == ""

- name: Collect git username
  ansible.builtin.set_fact:
    git_user_name: "{{ git_username_prompt.user_input }}"
  when: git_user_name is undefined and git_username_prompt is not skipped

- name: Set git username
  community.general.git_config:
    name: user.name
    scope: global
    value: "{{ git_user_name }}"
  when: git_user_name is defined and git_user_name != ""

- name: Check git email
  community.general.git_config_info:
    name: user.email
    scope: global
  register: git_email_config

- name: Prompt git email
  ansible.builtin.pause:
    prompt: Insert git email
  register: git_email_prompt
  when: git_user_email is undefined and git_email_config.config_value == ""

- name: Collect git email
  ansible.builtin.set_fact:
    git_user_email: "{{ git_email_prompt.user_input }}"
  when: git_user_email is undefined and git_email_prompt is not skipped

- name: Set git email
  community.general.git_config:
    name: user.email
    scope: global
    value: "{{ git_user_email }}"
  when: git_user_email is defined and git_user_email != ""

- name: Set vim as the default editor
  community.general.git_config:
    name: core.editor
    scope: global
    value: vim

- name: Include aliases
  ansible.builtin.import_tasks: aliases.yml

- name: Include global hooks
  ansible.builtin.import_tasks: hooks.yml
