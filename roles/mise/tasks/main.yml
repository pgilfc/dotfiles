---
# repo id/file match what `dnf copr enable jdxcode/mise` would create, so
# a manual enable can't produce a duplicate repo. includepkgs limits the
# COPR to the explicitly declared packages — nothing else it ships can be
# installed or shadow a Fedora package
- name: Add the mise COPR repository
  become: true
  ansible.builtin.yum_repository:
    name: "copr:copr.fedorainfracloud.org:jdxcode:mise"
    file: "_copr:copr.fedorainfracloud.org:jdxcode:mise"
    description: Copr repo for mise owned by jdxcode
    baseurl: "https://download.copr.fedorainfracloud.org/results/jdxcode/mise/fedora-$releasever-$basearch/"
    gpgcheck: true
    gpgkey: "https://download.copr.fedorainfracloud.org/results/jdxcode/mise/pubkey.gpg"
    repo_gpgcheck: false
    skip_if_unavailable: true
    enabled: true
    includepkgs: "{{ mise_copr_packages }}"

- name: Install mise
  become: true
  ansible.builtin.dnf:
    name: "{{ mise_copr_packages }}"
    state: present

# node links against libatomic, which a minimal Fedora install lacks
- name: Install runtime libraries needed by mise-managed tools
  become: true
  ansible.builtin.dnf:
    name: libatomic
    state: present

- name: List tools already pinned in the global mise config
  ansible.builtin.command:
    cmd: mise ls --global --json
  register: mise_ls_global
  changed_when: false

- name: Install global tool versions with mise
  ansible.builtin.command:
    cmd: "mise use --global {{ item }}"
  loop: "{{ mise_global_tools }}"
  when: (item.split('@') | first) not in (mise_ls_global.stdout | from_json)
  changed_when: true
