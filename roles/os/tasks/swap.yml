---
# Fedora's stock zram (priority 100) stays as runtime swap; this only adds a
# swapfile (default priority -2) for overflow and the hibernation image.
# systemd skips zram devices when picking a hibernation target.
- name: Check swap subvolume
  ansible.builtin.stat:
    path: "{{ os_swap_subvolume }}"
    get_checksum: false
  register: os_swap_subvol_stat

# a dedicated subvolume keeps the swapfile out of snapshots of /
# (btrfs refuses to snapshot a subvolume holding an active swapfile)
- name: Create swap subvolume
  ansible.builtin.command:
    cmd: btrfs subvolume create {{ os_swap_subvolume }}
  changed_when: true
  when: not os_swap_subvol_stat.stat.exists

- name: Check swap file
  ansible.builtin.stat:
    path: "{{ os_swap_file }}"
    get_checksum: false
  register: os_swap_file_stat

# MemTotal wobbles a little across kernel/firmware updates; only a mismatch
# beyond 1 GiB (RAM change, corrupt file) is worth the swapoff/recreate cycle
- name: Recreate swap file if missing or wrongly sized
  when: >-
    not os_swap_file_stat.stat.exists
    or ((os_swap_file_stat.stat.size / 1048576) - (os_swap_size_mib | int)) | abs > 1024
  block:
    # only the swapfile — zram must stay active
    - name: Turn off swap file if active
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -e
          if awk -v f='{{ os_swap_file }}' 'BEGIN {rc=1} $1 == f {rc=0} END {exit rc}' /proc/swaps; then
            swapoff '{{ os_swap_file }}'
            echo deactivated
          fi
      register: os_swapoff
      changed_when: os_swapoff.stdout == "deactivated"

    # mkswapfile refuses to overwrite, so drop any leftover from an
    # interrupted previous run first
    - name: Remove stale temporary swap file
      ansible.builtin.file:
        path: "{{ os_swap_file }}.new"
        state: absent

    # build the replacement under a temporary name and rename it into place:
    # an interruption never leaves fstab pointing at a missing swapfile, and
    # a same-directory rename does not move extents, so the physical offset
    # hibernate.yml reads from the final path afterwards stays valid
    - name: Create a swap file
      ansible.builtin.command:
        cmd: btrfs filesystem mkswapfile --size {{ os_swap_size_mib }}m {{ os_swap_file }}.new
      changed_when: true

    - name: Move new swap file into place
      ansible.builtin.command:
        cmd: mv {{ os_swap_file }}.new {{ os_swap_file }}
      changed_when: true

- name: Mount swap
  ansible.posix.mount:
    src: "{{ os_swap_file }}"
    path: none
    fstype: swap
    opts: sw
    dump: 0
    passno: 0
    boot: true
    backup: true
    state: present

- name: List active swap devices
  ansible.builtin.command:
    cmd: swapon --show=NAME --noheadings
  register: os_active_swaps
  changed_when: false
  check_mode: false

# activates fstab swaps not yet active; only runs when the swapfile is not
# already active, so activation is reported as a real change
- name: Turn on swap
  ansible.builtin.command:
    cmd: swapon -a
  changed_when: true
  when: os_swap_file not in os_active_swaps.stdout_lines
