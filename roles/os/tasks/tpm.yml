---
# os_luks_uuid comes from devices.yml, which main.yml imports first;
# an existing systemd-tpm2 token means enrollment already happened, so the
# prompt and the wipe/re-enroll below are skipped to keep the run idempotent
- name: Check for existing TPM2 LUKS enrollment
  ansible.builtin.command:
    cmd: cryptsetup luksDump /dev/disk/by-uuid/{{ os_luks_uuid.stdout }}
  register: os_luks_dump
  changed_when: false
  check_mode: false

# gated behind os_enroll_tpm in main.yml so unattended runs never block here;
# non-interactive callers (cmd/vm/vm.sh test) inject -e os_luks_passkey=...
# to skip the prompt
- name: Prompt disk encryption passkey
  ansible.builtin.pause:
    prompt: Insert luks passkey (empty skips enrollment)
    echo: false
  register: os_luks_passkey_prompt
  no_log: true # user_input holds the plaintext passphrase
  when:
    - "'systemd-tpm2' not in os_luks_dump.stdout"
    - os_luks_passkey is undefined

- name: Collect passkey
  ansible.builtin.set_fact:
    os_luks_passkey: "{{ os_luks_passkey_prompt.user_input }}"
  no_log: true # the passphrase must not reach the log
  when:
    - "'systemd-tpm2' not in os_luks_dump.stdout"
    - os_luks_passkey is undefined

- name: Enroll LUKS key to TPM2
  ansible.builtin.command:
    cmd: >-
      systemd-cryptenroll /dev/disk/by-uuid/{{ os_luks_uuid.stdout }}
      --wipe-slot=tpm2 --tpm2-device=auto
  environment:
    PASSWORD: "{{ os_luks_passkey }}"
  no_log: true # the passphrase travels in the environment
  register: os_tpm_enroll
  changed_when: true
  when:
    - "'systemd-tpm2' not in os_luks_dump.stdout"
    - os_luks_passkey | default("") != ""

- name: Enable dracut module tpm2-tss
  ansible.builtin.import_tasks: dracut-module.yml
  vars:
    os_dracut_module: tpm2-tss
  when: os_tpm_enroll is not skipped
