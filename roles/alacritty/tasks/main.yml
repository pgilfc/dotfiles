---
- name: Install Alacritty
  become: true
  ansible.builtin.dnf:
    name: alacritty
    state: present

- name: Creates alacritty conf directory if not exists
  ansible.builtin.file:
    path: "{{ alacritty_conf_dir }}"
    state: directory
    mode: "0755"

- name: Symlink alacritty config
  ansible.builtin.file:
    src: "{{ role_path }}/files/alacritty.toml"
    dest: "{{ alacritty_conf }}"
    state: link
    force: true
